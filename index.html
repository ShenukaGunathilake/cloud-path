<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cloud Path">
<meta name="theme-color" content="#0f172a">
<title>Cloud Path – Study Tracker</title>
<style>
:root{
  --bg:#0f172a;--card:#1e293b;--card2:#273449;--text:#f1f5f9;--muted:#94a3b8;
  --accent:#38bdf8;--accent2:#0ea5e9;--ok:#22c55e;--warn:#f59e0b;--bad:#ef4444;--line:#334155;
}
@media (prefers-color-scheme: light){
  :root{--bg:#f1f5f9;--card:#ffffff;--card2:#f8fafc;--text:#0f172a;--muted:#64748b;--line:#e2e8f0;--accent:#0284c7;--accent2:#0369a1;}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);
  padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom));}
header{padding:18px 18px 6px}
header h1{margin:0;font-size:24px}
header p{margin:4px 0 0;color:var(--muted);font-size:14px}
main{padding:8px 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:10px 0}
.card h2{margin:0 0 8px;font-size:18px}
.card h3{margin:0 0 6px;font-size:16px}
.muted{color:var(--muted);font-size:14px}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0}
.bar>div{height:100%;background:linear-gradient(90deg,var(--accent),var(--ok));border-radius:99px;transition:width .3s}
.big{font-size:34px;font-weight:700}
.row{display:flex;gap:10px;align-items:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{font-size:22px;display:block}
.month{cursor:pointer}
.month .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pill{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--card2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.done{background:rgba(34,197,94,.15);color:var(--ok);border-color:transparent}
.pill.now{background:rgba(56,189,248,.15);color:var(--accent);border-color:transparent}
.tasks{margin-top:12px;display:none}
.month.open .tasks{display:block}
label.task{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);font-size:15px;cursor:pointer}
label.task input{width:22px;height:22px;accent-color:var(--ok);flex:none;margin-top:1px}
label.task.checked span{color:var(--muted);text-decoration:line-through}
.exam{color:var(--warn);font-weight:600}
button{font:inherit;border:none;border-radius:12px;padding:12px 16px;background:var(--accent2);color:#fff;font-weight:600;cursor:pointer}
button.ghost{background:var(--card2);color:var(--text);border:1px solid var(--line)}
button.small{padding:8px 12px;font-size:14px}
.opt{display:block;width:100%;text-align:left;margin:8px 0;background:var(--card2);color:var(--text);border:1px solid var(--line);font-weight:500}
.opt.right{background:rgba(34,197,94,.18);border-color:var(--ok)}
.opt.wrong{background:rgba(239,68,68,.18);border-color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:15px}
td{padding:10px 4px;border-top:1px solid var(--line);vertical-align:top}
td:last-child{text-align:right;white-space:nowrap;color:var(--muted)}
a{color:var(--accent)}
.res a{display:block;padding:10px 0;border-top:1px solid var(--line);text-decoration:none}
.res a small{display:block;color:var(--muted)}
select{font:inherit;padding:10px;border-radius:12px;background:var(--card2);color:var(--text);border:1px solid var(--line);width:100%}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;
  padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;background:none;color:var(--muted);padding:6px 2px;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button .ic{font-size:21px}
nav button.active{color:var(--accent)}
.hidden{display:none}
.counter{display:flex;align-items:center;gap:12px}
.counter button{width:44px;height:44px;padding:0;font-size:22px}
textarea{width:100%;min-height:90px;font:inherit;padding:10px;border-radius:12px;background:var(--card2);color:var(--text);border:1px solid var(--line)}
</style>
</head>
<body>
<header>
  <h1>☁️ Cloud Path</h1>
  <p>Cloud Engineer roadmap · Nov 2026 – Oct 2027</p>
</header>

<main>
  <!-- HOME -->
  <section id="home"></section>
  <!-- ROADMAP -->
  <section id="roadmap" class="hidden"></section>
  <!-- QUIZ -->
  <section id="quiz" class="hidden"></section>
  <!-- PLAN -->
  <section id="plan" class="hidden"></section>
  <!-- RESOURCES -->
  <section id="resources" class="hidden"></section>
</main>

<nav>
  <button data-tab="home" class="active"><span class="ic">🏠</span>Home</button>
  <button data-tab="roadmap"><span class="ic">🗺️</span>Roadmap</button>
  <button data-tab="quiz"><span class="ic">❓</span>Quiz</button>
  <button data-tab="plan"><span class="ic">📅</span>Week</button>
  <button data-tab="resources"><span class="ic">📚</span>Learn</button>
</nav>

<script>
/* ---------- DATA ---------- */
const MONTHS = [
 {t:"Networking & Linux", d:"Nov 2026", tasks:[
  "Networks: LAN, WAN, client–server, how the internet works",
  "IPv4, public vs private IPs, static vs dynamic",
  "Subnet masks and CIDR (/24, /16, /28…)",
  "DNS – how names become IP addresses",
  "TCP vs UDP + ports: 22, 53, 80, 443, 3389",
  "Routers, switches, firewalls, gateways and routing",
  "Packet Tracer labs (build 2–3 small networks)",
  "Linux: files, folders, permissions, users",
  "Linux: processes, packages, SSH, Bash basics",
  "Month 1 revision test (no notes)"]},
 {t:"Azure Fundamentals (AZ-900)", d:"Dec 2026", tasks:[
  "Cloud concepts: IaaS, PaaS, SaaS; public/private/hybrid",
  "Regions, availability zones, subscriptions, resource groups",
  "Core services: compute, storage, networking",
  "Identity & security basics: Entra ID, RBAC, MFA",
  "Pricing, SLAs, cost management tools",
  "Azure CLI and PowerShell basics",
  "Finish Microsoft Learn AZ-900 path",
  "Practice exams – score 80%+ twice",
  "🎯 EXAM: Book and pass AZ-900",
  "Start applying for IT support roles"]},
 {t:"AZ-104 Part 1 – Identity & Storage", d:"Jan 2027", tasks:[
  "Entra ID: users, groups, licences",
  "RBAC roles and Azure Policy",
  "Management groups and subscriptions",
  "Storage accounts, Blob, File shares",
  "Access tiers, redundancy (LRS/ZRS/GRS), SAS tokens",
  "🚀 Project 1: static website on Blob storage → GitHub"]},
 {t:"AZ-104 Part 2 – Compute & Networking", d:"Feb 2027", tasks:[
  "Virtual machines: sizes, disks, availability sets/zones",
  "VM Scale Sets and App Service",
  "VNets, subnets and NSGs",
  "VNet peering and VPN gateway basics",
  "Load Balancer vs Application Gateway",
  "Azure DNS",
  "🚀 Project 2: 2-tier app (web + DB) inside a VNet"]},
 {t:"AZ-104 Part 3 – Monitor & Exam", d:"Mar 2027", tasks:[
  "Azure Monitor, Log Analytics (KQL), alerts",
  "Azure Backup and Site Recovery",
  "ARM templates / Bicep introduction",
  "Practice exams – score 80%+ twice",
  "🎯 EXAM: Pass AZ-104",
  "Update CV + LinkedIn with AZ-104"]},
 {t:"Terraform & GitHub Actions", d:"Apr 2027", tasks:[
  "Git refresh: branches, pull requests",
  "Terraform basics: providers, resources, plan/apply",
  "Variables, outputs and modules",
  "Remote state in Azure Storage",
  "GitHub Actions workflow basics",
  "🚀 Project 3: Terraform deploys VNet + VM via a pipeline"]},
 {t:"Docker & CI/CD", d:"May 2027", tasks:[
  "Images, containers and Dockerfiles",
  "Docker Compose",
  "Azure Container Registry",
  "Deploy a container to App Service / Container Apps",
  "CI/CD pipeline: build → push → deploy",
  "🚀 Project 4: containerise one of your own web apps"]},
 {t:"Kubernetes (AKS) & Terraform exam", d:"Jun 2027", tasks:[
  "Kubernetes concepts: pods, deployments, services",
  "kubectl essentials",
  "Create an AKS cluster (with Terraform)",
  "Deploy an app to AKS with ingress",
  "Terraform Associate practice exams",
  "🎯 EXAM: Pass Terraform Associate"]},
 {t:"Portfolio & Job-ready", d:"Jul 2027", tasks:[
  "Polish 3–4 projects: README + architecture diagram",
  "Security: Key Vault and managed identities",
  "Cost optimisation of your projects",
  "Write 2 LinkedIn posts about your projects",
  "Tailor CV for junior cloud / DevOps roles",
  "Do 2 mock interviews"]},
 {t:"AWS Fundamentals", d:"Aug 2027", tasks:[
  "Check Sydney job ads: AWS or advanced Azure next?",
  "IAM: users, roles, policies, least privilege",
  "EC2, EBS and AMIs",
  "S3 and storage classes",
  "VPC, subnets, route tables, gateways",
  "RDS, DynamoDB, Lambda basics"]},
 {t:"AWS Solutions Architect prep", d:"Sep 2027", tasks:[
  "Well-Architected Framework (6 pillars)",
  "High availability: ELB, Auto Scaling, multi-AZ",
  "Route 53 and CloudFront",
  "Security: KMS, security groups vs NACLs",
  "Cost optimisation: Savings Plans, Spot, S3 tiers",
  "Practice exams – score 80%+ twice"]},
 {t:"SAA Exam & Job push", d:"Oct 2027", tasks:[
  "🎯 EXAM: Pass AWS Solutions Architect Associate",
  "🚀 Project 5: rebuild a project on AWS with Terraform",
  "Final portfolio review",
  "Apply to 10 jobs a week",
  "Interview prep: scenario questions"]}
];

const QUIZ = [
 [["What does DNS do?",["Encrypts passwords","Translates domain names into IP addresses","Speeds up the internet"],1],
  ["Default port for HTTPS?",["80","22","443"],2],
  ["Usable host addresses in a /24 network?",["254","256","24"],0]],
 [["Which is an example of PaaS?",["Azure Virtual Machines","Azure App Service","Microsoft 365"],1],
  ["What is a resource group?",["A billing account","A logical container for related resources","A type of VM"],1],
  ["Availability zones protect against…",["A datacenter failure within a region","Bad passwords","High prices"],0]],
 [["Which role can manage resources but NOT grant access to others?",["Owner","Contributor","Reader"],1],
  ["Best storage for unstructured files like images?",["Blob storage","Queue storage","Table storage"],0],
  ["Azure Policy is used to…",["Enforce rules on resources","Back up VMs","Create users"],0]],
 [["What does an NSG do?",["Filters network traffic","Stores VM disks","Resolves DNS"],0],
  ["VNet peering…",["Connects two VNets privately","Encrypts storage","Creates subnets"],0],
  ["VM Scale Sets let you…",["Automatically scale identical VMs","Resize disks","Rename VMs"],0]],
 [["Query language used in Log Analytics?",["SQL","KQL","GraphQL"],1],
  ["A Recovery Services vault is used for…",["Backup and Site Recovery","Storing secrets","Hosting websites"],0],
  ["Bicep is…",["A monitoring tool","A declarative IaC language for Azure","A VM size"],1]],
 [["Which command previews Terraform changes?",["terraform apply","terraform plan","terraform init"],1],
  ["The Terraform state file…",["Maps your config to real resources","Stores passwords","Is optional and never used"],0],
  ["Where are GitHub Actions workflows stored?",[".github/workflows",".git/actions","/workflows"],0]],
 [["A Dockerfile is…",["A running container","Instructions to build an image","A registry"],1],
  ["Image vs container?",["They are the same","A container is a running instance of an image","An image runs a container"],1],
  ["Azure Container Registry is…",["A private registry for container images","A Kubernetes cluster","A DNS service"],0]],
 [["Smallest deployable unit in Kubernetes?",["Node","Pod","Service"],1],
  ["A Kubernetes Service provides…",["A stable network endpoint for pods","Storage","Logging"],0],
  ["kubectl get pods…",["Deletes pods","Lists pods","Creates pods"],1]],
 [["Where should secrets live in Azure?",["In code","Key Vault","A text file in storage"],1],
  ["Main benefit of managed identities?",["No credentials stored in code","Cheaper VMs","Faster networks"],0],
  ["A strong portfolio README includes…",["Only a title","Architecture diagram and how to deploy","Your exam scores"],1]],
 [["AWS object storage service?",["EBS","S3","EFS"],1],
  ["IAM best practice?",["Use root for everything","Least privilege","Share access keys"],1],
  ["A VPC is…",["An isolated virtual network","A VM type","A database"],0]],
 [["How many Well-Architected pillars are there?",["Four","Five","Six"],2],
  ["Security groups are…",["Stateful","Stateless","Only for S3"],0],
  ["CloudFront is…",["A CDN","A database","A firewall"],0]],
 [["Which service spreads traffic across EC2 instances?",["Route 53","Elastic Load Balancing","CloudWatch"],1],
  ["An Auto Scaling group…",["Adjusts the number of instances","Backs up S3","Encrypts data"],0],
  ["Cheapest for steady 1–3 year workloads?",["On-Demand","Savings Plans / Reserved","Dedicated Hosts"],1]]
];

const RES = [
 ["Networking & Linux",[["Cisco Networking Academy","https://www.netacad.com","Free networking courses"],["Professor Messer","https://www.professormesser.com","Free Network+ videos"],["Cisco Packet Tracer","https://www.netacad.com/cisco-packet-tracer","Network simulator"],["Linux Journey","https://linuxjourney.com","Free Linux lessons"]]],
 ["Azure",[["AZ-900 on Microsoft Learn","https://learn.microsoft.com/en-us/credentials/certifications/azure-fundamentals/","Free official path"],["AZ-104 on Microsoft Learn","https://learn.microsoft.com/en-us/credentials/certifications/azure-administrator/","Free official path"],["John Savill (YouTube)","https://www.youtube.com/@NTFAQGuy","Free AZ-900/104 cram videos"]]],
 ["DevOps",[["Terraform tutorials","https://developer.hashicorp.com/terraform/tutorials","Free official labs"],["Terraform Associate exam","https://developer.hashicorp.com/certifications/terraform-associate","Exam info"],["Docker – Get started","https://docs.docker.com/get-started/","Official guide"],["GitHub Actions docs","https://docs.github.com/en/actions","CI/CD"],["Kubernetes tutorials","https://kubernetes.io/docs/tutorials/","Official"]]],
 ["AWS",[["AWS Skill Builder","https://skillbuilder.aws","Free AWS courses"],["Solutions Architect Associate","https://aws.amazon.com/certification/certified-solutions-architect-associate/","Exam info"],["AWS re/Start","https://aws.amazon.com/training/restart/","Free 12-week program"]]],
 ["Projects",[["Cloud Resume Challenge","https://cloudresumechallenge.dev","Famous starter project"]]]
];

const WEEK = [["Monday","Learn new concepts","2h"],["Tuesday","Lessons + notes","2h"],["Wednesday","Practical exercises","2h"],["Thursday","Continue lessons","2h"],["Friday","Revision + quiz","2h"],["Saturday","Hands-on labs / project","3–5h"],["Sunday","Revision + weekly test","2–3h"]];

/* ---------- STORAGE ---------- */
const KEY="cloudpath_v1";
let S={done:{},hours:{},quiz:{},notes:"",open:0};
try{const r=localStorage.getItem(KEY); if(r) S=Object.assign(S,JSON.parse(r));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

function weekKey(d=new Date()){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return t.getUTCFullYear()+"-W"+Math.ceil(((t-y)/864e5+1)/7);}
const tid=(m,i)=>m+"_"+i;
function monthStats(m){const n=MONTHS[m].tasks.length;let c=0;for(let i=0;i<n;i++) if(S.done[tid(m,i)]) c++;return {c,n};}
function totals(){let c=0,n=0;MONTHS.forEach((_,m)=>{const s=monthStats(m);c+=s.c;n+=s.n});return {c,n};}
function currentMonth(){for(let m=0;m<MONTHS.length;m++){const s=monthStats(m);if(s.c<s.n) return m;}return MONTHS.length-1;}
const pct=(c,n)=>n?Math.round(c/n*100):0;

/* ---------- RENDER ---------- */
function renderHome(){
  const T=totals(),cm=currentMonth(),ms=monthStats(cm),wk=weekKey(),h=S.hours[wk]||0;
  const next=MONTHS[cm].tasks.findIndex((_,i)=>!S.done[tid(cm,i)]);
  const exams=MONTHS.flatMap((m,mi)=>m.tasks.map((t,i)=>({t,mi,i}))).filter(x=>x.t.includes("EXAM"));
  const passed=exams.filter(x=>S.done[tid(x.mi,x.i)]).length;
  document.getElementById("home").innerHTML=`
  <div class="card"><div class="muted">Overall progress</div>
    <div class="big">${pct(T.c,T.n)}%</div><div class="bar"><div style="width:${pct(T.c,T.n)}%"></div></div>
    <div class="muted">${T.c} of ${T.n} tasks done</div></div>
  <div class="card"><div class="row" style="justify-content:space-between"><div><div class="muted">Current month · ${MONTHS[cm].d}</div>
    <h2 style="margin-top:4px">Month ${cm+1}: ${MONTHS[cm].t}</h2></div></div>
    <div class="bar"><div style="width:${pct(ms.c,ms.n)}%"></div></div>
    <div class="muted">${ms.c}/${ms.n} tasks</div>
    ${next>=0?`<p style="margin:12px 0 4px"><b>Next up:</b> ${MONTHS[cm].tasks[next]}</p>
    <button class="small" onclick="tick(${cm},${next})">✓ Mark done</button>`:`<p>🎉 Month complete!</p>`}</div>
  <div class="grid">
    <div class="stat"><span class="muted">This week</span><b>${h}h</b><span class="muted">of 15h target</span>
      <div class="bar"><div style="width:${Math.min(100,pct(h,15))}%"></div></div>
      <div class="counter"><button class="ghost" onclick="hrs(-1)">−</button><button onclick="hrs(1)">+</button></div></div>
    <div class="stat"><span class="muted">Exams passed</span><b>${passed}/${exams.length}</b><span class="muted">AZ-900 · AZ-104 · Terraform · AWS SAA</span></div>
  </div>
  <div class="card"><h3>📝 My notes</h3><textarea id="notes" placeholder="Questions, links, things to revise…">${esc(S.notes)}</textarea></div>
  <div class="card muted">💡 Spend at least 40% of study time hands-on. Start applying for IT support roles from Month 2–3.</div>`;
  document.getElementById("notes").addEventListener("input",e=>{S.notes=e.target.value;save();});
}
function esc(s){return (s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}

function renderRoadmap(){
  const cm=currentMonth();
  document.getElementById("roadmap").innerHTML=`<div class="muted" style="padding:0 4px">Tap a month to open its checklist.</div>`+
  MONTHS.map((m,mi)=>{const s=monthStats(mi),done=s.c===s.n;
    return `<div class="card month ${S.open===mi?"open":""}" onclick="toggleMonth(event,${mi})">
     <div class="top"><div><div class="muted">Month ${mi+1} · ${m.d}</div><h3 style="margin:2px 0 0">${m.t}</h3></div>
     <span class="pill ${done?"done":mi===cm?"now":""}">${done?"Done ✓":mi===cm?"Now":s.c+"/"+s.n}</span></div>
     <div class="bar"><div style="width:${pct(s.c,s.n)}%"></div></div>
     <div class="tasks">${m.tasks.map((t,i)=>{const on=!!S.done[tid(mi,i)];
       return `<label class="task ${on?"checked":""}"><input type="checkbox" ${on?"checked":""} onchange="setTask(${mi},${i},this.checked)"><span class="${t.includes("EXAM")?"exam":""}">${t}</span></label>`}).join("")}</div>
    </div>`}).join("")+
  `<div class="card"><button class="ghost small" onclick="resetAll()">Reset all progress</button></div>`;
}

let qMonth=null,qIdx=0,qScore=0,qLocked=false;
function renderQuiz(){
  const el=document.getElementById("quiz");
  if(qMonth===null){
    el.innerHTML=`<div class="card"><h2>Monthly quizzes</h2><p class="muted">3 quick questions per month. Your best score is saved.</p>
    <select id="qsel">${MONTHS.map((m,i)=>`<option value="${i}" ${i===currentMonth()?"selected":""}>Month ${i+1}: ${m.t}${S.quiz[i]!=null?" — best "+S.quiz[i]+"/3":""}</option>`).join("")}</select>
    <div style="height:12px"></div><button onclick="startQuiz()">Start quiz</button></div>`;
    return;
  }
  const qs=QUIZ[qMonth];
  if(qIdx>=qs.length){
    S.quiz[qMonth]=Math.max(S.quiz[qMonth]||0,qScore);save();
    el.innerHTML=`<div class="card"><h2>Score: ${qScore}/${qs.length}</h2><p class="muted">${qScore===qs.length?"Perfect! 🎉":"Revise the ones you missed and try again."}</p>
    <div class="row"><button onclick="startQuiz(${qMonth})">Retry</button><button class="ghost" onclick="qMonth=null;renderQuiz()">Other month</button></div></div>`;
    return;
  }
  const [q,opts]=qs[qIdx];
  el.innerHTML=`<div class="card"><div class="muted">Month ${qMonth+1} · Question ${qIdx+1}/${qs.length}</div><h2 style="margin-top:6px">${q}</h2>
  ${opts.map((o,i)=>`<button class="opt" onclick="answer(this,${i})">${o}</button>`).join("")}<div id="qnext"></div></div>`;
}
function startQuiz(m){qMonth=m!=null?m:+document.getElementById("qsel").value;qIdx=0;qScore=0;qLocked=false;renderQuiz();}
function answer(btn,i){
  if(qLocked) return; qLocked=true;
  const right=QUIZ[qMonth][qIdx][2]; const btns=btn.parentElement.querySelectorAll(".opt");
  btns[right].classList.add("right"); if(i!==right) btn.classList.add("wrong"); else qScore++;
  document.getElementById("qnext").innerHTML=`<button style="margin-top:8px" onclick="qIdx++;qLocked=false;renderQuiz()">Next →</button>`;
}

function renderPlan(){
  document.getElementById("plan").innerHTML=`<div class="card"><h2>Weekly timetable</h2><p class="muted">Aim for 15–20 hours. Move days around your work roster.</p>
  <table>${WEEK.map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join("")}</table></div>
  <div class="card"><h2>Exam budget</h2><table>
   <tr><td>AZ-900</td><td>~AUD $99–150</td></tr><tr><td>AZ-104</td><td>~AUD $180</td></tr>
   <tr><td>Terraform Associate</td><td>USD $70.50 + tax</td></tr><tr><td>AWS SAA</td><td>USD $150</td></tr></table>
   <p class="muted">Tip: Microsoft Virtual Training Days sometimes give free AZ-900 vouchers.</p></div>
  <div class="card"><h2>Rules</h2><ul style="margin:0;padding-left:20px;line-height:1.6">
   <li>One topic at a time</li><li>Practise everything hands-on</li><li>Weekly quiz every Friday</li><li>Projects beat certificates</li><li>Apply for jobs before you finish</li></ul></div>`;
}
function renderResources(){
  document.getElementById("resources").innerHTML=RES.map(([h,list])=>`<div class="card res"><h2>${h}</h2>${list.map(([n,u,d])=>`<a href="${u}" target="_blank" rel="noopener">${n}<small>${d}</small></a>`).join("")}</div>`).join("");
}

/* ---------- ACTIONS ---------- */
function setTask(m,i,v){if(v) S.done[tid(m,i)]=1; else delete S.done[tid(m,i)]; save(); renderAll(true);}
function tick(m,i){setTask(m,i,true);}
function toggleMonth(e,m){if(e.target.closest("label")) return; S.open=S.open===m?-1:m; save(); renderRoadmap();}
function hrs(d){const k=weekKey();S.hours[k]=Math.max(0,(S.hours[k]||0)+d);save();renderHome();}
function resetAll(){if(confirm("Reset all progress? This can't be undone.")){S={done:{},hours:{},quiz:{},notes:"",open:0};save();renderAll();}}
function renderAll(){renderHome();renderRoadmap();renderPlan();renderResources();}

document.querySelectorAll("nav button").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("active",x===b));
  document.querySelectorAll("main>section").forEach(s=>s.classList.toggle("hidden",s.id!==b.dataset.tab));
  if(b.dataset.tab==="quiz"){qMonth=null;renderQuiz();}
  window.scrollTo(0,0);
}));
if(S.open===undefined) S.open=currentMonth();
renderAll(); renderQuiz();
</script>
</body>
</html>
